<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="BN Yönetim Finans ve Muhasebe modülü — tahakkuk, tahsilat, bütçe, nakit, mutabakat, onay ve denetim.">
<title>BN Yönetim — Finans &amp; Muhasebe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VERSION 22 DESIGN SYSTEM — FROZEN
   Palette corrected in Sprint 02: the V22 dashboard carries an
   18-colour palette, including a full accent set used by the
   eight "BN AI Bölümü" cards. All of it is reproduced verbatim.
   ============================================================ */
:root{
/* core (V22) */
--primary:#0E7490;--secondary:#2563EB;--dark:#0F172A;--darker:#060B14;--deepest:#030712;
--text:#E2E8F0;--success:#10B981;--muted-v22:#94A3B8;
/* accent set (V22 ai-card 1..8, verbatim) */
--a1:#0E7490;--a2:#10B981;--a3:#2563EB;--a4:#EC4899;
--a5:#F59E0B;--a6:#8B5CF6;--a7:#06B6D4;--a8:#14B8A6;
/* remaining V22 palette members */
--a9:#A855F7;--a10:#F97316;--a11:#EAB308;--a12:#3B82F6;--crit:#EF4444;
--warn:#F59E0B;--info:#38BDF8;
--glass-bg:rgba(15,23,42,.6);--glass-br:rgba(255,255,255,.06);
--grad:linear-gradient(135deg,#0E7490,#2563EB);--glow:0 0 60px rgba(14,116,144,.15);
--muted:rgba(226,232,240,.68);--muted-2:#94A3B8;--line:rgba(255,255,255,.06);
--r:14px;--rs:10px;
--d1:4px;--d2:8px;--d3:12px;--d4:16px;--d6:24px;--d8:32px;--pad:20px;--cardpad:20px;--rowh:44px;--fz:14px;
}
body[data-density="compact"]{--pad:12px;--cardpad:14px;--rowh:34px;--d6:16px;--d8:22px;--fz:13px}
*{margin:0;padding:0;box-sizing:border-box;font-family:'DM Sans',system-ui,sans-serif}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--text);font-size:var(--fz);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--grad);color:#fff;padding:10px 16px;border-radius:var(--rs);font-weight:700}
.skip:focus{left:8px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== SHELL (Sprint 01 component library, unchanged) ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--darker);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line)}
.bmark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--grad);box-shadow:0 0 30px rgba(14,116,144,.35)}
.btxt b{display:block;font-size:14px;font-weight:700}.btxt small{display:block;font-size:11px;color:var(--muted-2)}
.snav{padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .2s;border-right:3px solid transparent;width:100%;background:none;border-top:0;border-left:0;border-bottom:0;text-align:left}
.nav-item:hover:not(.active){background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:rgba(14,116,144,.15);color:#0E7490;border-right:3px solid #0E7490;font-weight:600}
.nav-item svg{width:17px;height:17px;flex:0 0 auto}
.side-foot{padding:14px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted-2)}
.main{min-width:0;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:35;background:rgba(6,11,20,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px var(--pad);display:flex;align-items:center;gap:var(--d3);flex-wrap:wrap}
.hdr h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
.hdr .date{font-size:12.5px;color:var(--muted-2)}
.hspace{flex:1}
.iconbtn{width:36px;height:36px;min-width:36px;border-radius:var(--rs);display:grid;place-items:center;background:rgba(255,255,255,.03);border:1px solid var(--glass-br);color:var(--muted);cursor:pointer;transition:all .2s;position:relative}
.iconbtn:hover{color:var(--text);border-color:rgba(14,116,144,.4);background:rgba(14,116,144,.12)}
.iconbtn svg{width:17px;height:17px}
.badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--crit);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--darker)}
.searchbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:var(--rs);background:rgba(255,255,255,.03);border:1px solid var(--glass-br);color:var(--muted-2);font-size:13px;cursor:pointer;transition:all .2s}
.searchbtn:hover{border-color:rgba(14,116,144,.4);color:var(--text)}
.searchbtn kbd{font-size:10.5px;font-weight:700;padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.06);border:1px solid var(--glass-br)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;cursor:pointer}
.content{padding:0 var(--pad) var(--d8);flex:1}
.tabsbar{padding:var(--d4) var(--pad) 0;border-bottom:1px solid var(--line);margin-bottom:var(--d6)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{font-size:13.5px;font-weight:600;padding:10px 14px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:#38BDF8;border-bottom-color:var(--primary)}
.tab svg{width:15px;height:15px}
.tab .cnt{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.07);color:var(--muted)}
.tab[aria-selected="true"] .cnt{background:rgba(14,116,144,.25);color:#7DD3FC}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--d4)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.sec{margin-bottom:var(--d6)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:var(--d3)}
.sec-h h2{font-size:15px;font-weight:700}
.sec-h .hint{font-size:11.5px;color:var(--muted-2);font-weight:500}
.sec-h .sp{flex:1}
.card{background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-br);border-radius:var(--r);padding:var(--cardpad);position:relative}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:var(--d3)}
.card-h h3{font-size:13px;font-weight:700}.card-h .sp{flex:1}.card-h .ts{font-size:10.5px;color:var(--muted-2)}
.kpi{background:var(--glass-bg);backdrop-filter:blur(16px);border:1px solid var(--glass-br);border-radius:var(--r);padding:var(--cardpad);cursor:pointer;transition:all .2s;text-align:left;width:100%;display:block;color:inherit}
.kpi:hover{border-color:rgba(14,116,144,.45);box-shadow:var(--glow);transform:translateY(-1px)}
.kpi .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.kpi .val{font-size:28px;font-weight:800;line-height:1.1;margin-top:6px;letter-spacing:-.02em}
.kpi .unit{font-size:14px;font-weight:700;color:var(--muted)}
.kpi .row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.delta svg{width:12px;height:12px}
.d-good{background:rgba(16,185,129,.14);color:#6EE7B7}.d-bad{background:rgba(239,68,68,.14);color:#FCA5A5}.d-flat{background:rgba(255,255,255,.06);color:var(--muted-2)}
.tgt{font-size:11px;color:var(--muted-2)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-height:var(--rowh)}
.li:last-child{border-bottom:0}
.li .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--primary)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:13.5px;font-weight:600}
.li .tx small{display:block;font-size:11.5px;color:var(--muted-2)}
.pri{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:6px;white-space:nowrap}
.p-acil{background:rgba(239,68,68,.16);color:#FCA5A5}.p-orta{background:rgba(245,158,11,.16);color:#FCD34D}.p-dusuk{background:rgba(16,185,129,.14);color:#6EE7B7}
.rowbtn{background:none;border:0;color:var(--muted-2);cursor:pointer;display:grid;place-items:center;padding:6px;border-radius:8px}
.rowbtn:hover{background:rgba(255,255,255,.05);color:var(--text)}
.rowbtn svg{width:15px;height:15px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:700;padding:9px 10px;background:rgba(14,116,144,.1);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:middle}
table.t tbody tr{transition:background .2s;cursor:pointer}
table.t tbody tr:hover{background:rgba(255,255,255,.03)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--glass-br);border-radius:var(--rs)}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:var(--rs);cursor:pointer;transition:all .2s;border:1px solid transparent;min-height:36px}
.btn svg{width:15px;height:15px}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 0 30px rgba(14,116,144,.25)}
.btn-p:hover{filter:brightness(1.1)}
.btn-s{background:rgba(255,255,255,.03);border-color:var(--glass-br);color:var(--muted)}
.btn-s:hover{color:var(--text);border-color:rgba(14,116,144,.45);background:rgba(14,116,144,.12)}
.btn-g{background:none;color:var(--muted-2);padding:6px 8px}.btn-g:hover{color:var(--text)}
.btn-d{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#FCA5A5}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{font-size:11.5px;padding:5px 10px;min-height:30px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--glass-br);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover{color:var(--text);border-color:rgba(14,116,144,.4)}
.chip.on{background:rgba(14,116,144,.15);color:#38BDF8;border-color:rgba(14,116,144,.45)}
.seg{display:inline-flex;border:1px solid var(--glass-br);border-radius:999px;background:rgba(255,255,255,.03);padding:2px}
.seg button{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;border:0;background:none;color:var(--muted);cursor:pointer;transition:all .2s}
.seg button.on{background:rgba(14,116,144,.2);color:#38BDF8}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sh 1.4s infinite;border-radius:6px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 16px;gap:8px;color:var(--muted-2)}
.state svg{width:26px;height:26px;opacity:.6}
.state b{font-size:13.5px;color:var(--muted)}.state small{font-size:12px;max-width:38ch}
.partial{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:var(--rs);background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);color:#FCD34D;font-size:12.5px;margin-bottom:var(--d4)}
.partial svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
.ov{position:fixed;inset:0;background:rgba(6,11,20,.72);backdrop-filter:blur(8px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto}
.ov.open{display:flex}
.dlg{width:100%;max-width:640px;background:#0B1220;border:1px solid var(--glass-br);border-radius:var(--r);box-shadow:0 24px 80px rgba(0,0,0,.6);animation:pop .18s ease}
.dlg.wide{max-width:920px}.dlg.narrow{max-width:460px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:15.5px;font-weight:700;flex:1}
.dlg-b{padding:20px;max-height:64vh;overflow-y:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
label.fl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
label.fl .req{color:#FCA5A5}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border-radius:var(--rs);background:rgba(255,255,255,.03);border:1px solid var(--glass-br);color:var(--text);font-size:13.5px;transition:border-color .2s}
.inp:focus{border-color:rgba(14,116,144,.6);outline:none}
.inp[aria-invalid="true"]{border-color:rgba(239,68,68,.6)}
textarea.inp{resize:vertical;min-height:78px}
.fg{margin-bottom:14px}
.err{font-size:11.5px;color:#FCA5A5;margin-top:5px;display:flex;align-items:center;gap:5px}.err svg{width:13px;height:13px}
.hintx{font-size:11.5px;color:var(--muted-2);margin-top:5px;display:flex;align-items:flex-start;gap:6px}
.hintx svg{width:13px;height:13px;flex:0 0 auto;margin-top:2px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:150;display:flex;flex-direction:column;gap:8px;max-width:400px}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--rs);background:#0B1220;border:1px solid var(--glass-br);box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .2s ease}
.toast.ok{border-left:3px solid var(--success)}.toast.err{border-left:3px solid var(--crit)}.toast.inf{border-left:3px solid var(--primary)}
.toast .tx{flex:1;font-size:13px}.toast .tx b{display:block;font-weight:700;margin-bottom:2px}.toast .tx small{color:var(--muted-2);font-size:11.5px}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#0B1220;border:1px solid var(--glass-br);padding:6px 10px;border-radius:8px;font-size:11.5px;font-weight:500;color:var(--text);white-space:nowrap;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sw{width:38px;height:21px;border-radius:11px;background:rgba(255,255,255,.1);border:1px solid var(--glass-br);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:all .2s}
.sw.on{background:rgba(14,116,144,.45)}.sw.on::after{left:19px;background:#38BDF8}
.sw:disabled{opacity:.45;cursor:not-allowed}
.scoped{max-width:600px;margin:60px auto;text-align:center;padding:32px}
.scoped h2{font-size:19px;font-weight:800;margin:14px 0 8px}
.scoped p{font-size:13.5px;color:var(--muted);margin-bottom:18px}

/* ============================================================
   AI CENTER — new compositions (built from the above primitives)
   ============================================================ */
/* governance bar — always visible, states scope + human review + kill switch */
.gov{display:flex;align-items:center;gap:var(--d3);flex-wrap:wrap;padding:10px var(--pad);background:rgba(14,116,144,.08);border-bottom:1px solid rgba(14,116,144,.2);font-size:12.5px}
.gov .g-i{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.gov .g-i svg{width:14px;height:14px;color:#38BDF8}
.gov .g-i b{color:var(--text);font-weight:600}
.gov .sp{flex:1}
body[data-ai="off"] .gov{background:rgba(239,68,68,.1);border-bottom-color:rgba(239,68,68,.3)}

/* V22 ai-card composition, reproduced verbatim: p-4 rounded-xl bg-white/5
   border border-white/10 hover:border-[accent]/50 · icon chip bg-[accent]/20 */
.aicard{padding:16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:all .3s;cursor:pointer;text-align:left;width:100%;color:inherit;display:block;position:relative}
.aicard:hover{transform:translateY(-2px)}
.aicard .ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;margin-bottom:12px}
.aicard .ico svg{width:16px;height:16px}
.aicard h3{font-size:13.5px;font-weight:600}
.aicard p{font-size:12px;color:#94A3B8;margin-top:4px;line-height:1.5}
.aicard .v22{position:absolute;top:12px;right:12px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:rgba(16,185,129,.15);color:#6EE7B7}
.aigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}

/* hologram panel — V22 geometry preserved */
.holo{position:relative;width:100%;max-width:384px;aspect-ratio:1;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 25px 50px -12px rgba(14,116,144,.1);margin:0 auto;background:radial-gradient(circle at 50% 40%,rgba(14,116,144,.35),rgba(37,99,235,.15) 45%,var(--deepest) 78%)}
.holo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--deepest),transparent 55%)}
.holo .core{position:absolute;inset:0;display:grid;place-items:center}
.holo .ring{position:absolute;border:1px solid rgba(14,116,144,.35);border-radius:50%;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.06);opacity:.35}}
.holo-cap{text-align:center;font-size:12px;color:#94A3B8;margin-top:14px}

/* conversation — V22 .chat-bubble preserved exactly */
.chat-bubble{max-width:80%}
.conv{display:flex;flex-direction:column;gap:16px;min-height:280px;max-height:52vh;overflow-y:auto;padding-right:4px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg .av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;font-size:10px;font-weight:800;color:#fff}
.msg.ai .av{background:var(--grad)}
.msg.me .av{background:rgba(255,255,255,.08);color:var(--muted)}
.bub{border-radius:12px;padding:12px;font-size:14px}
.msg.ai .bub{background:rgba(14,116,144,.2);border-top-left-radius:0}
.msg.me .bub{background:rgba(255,255,255,.05);border:1px solid var(--glass-br);border-top-right-radius:0}
.caret{display:inline-block;width:7px;height:14px;background:#38BDF8;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.prov{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#94A3B8}
.prov .pi{display:inline-flex;align-items:center;gap:4px}
.prov .pi svg{width:11px;height:11px}
.human-flag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:5px;background:rgba(245,158,11,.15);color:#FCD34D}
.human-flag svg{width:11px;height:11px}
.fb{display:flex;gap:2px;margin-left:auto}
.fb button{background:none;border:0;color:#94A3B8;cursor:pointer;padding:4px;border-radius:6px;display:grid;place-items:center}
.fb button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.fb button.on{color:var(--success)}.fb button.on.dn{color:#FCA5A5}
.fb svg{width:13px;height:13px}
.followups{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fu{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px dashed rgba(14,116,144,.4);background:rgba(14,116,144,.08);color:#7DD3FC;cursor:pointer;transition:all .2s}
.fu:hover{background:rgba(14,116,144,.18);border-style:solid}

/* composer */
.composer{border:1px solid var(--glass-br);border-radius:var(--r);background:rgba(255,255,255,.03);padding:10px;margin-top:14px}
.composer:focus-within{border-color:rgba(14,116,144,.5)}
.composer textarea{width:100%;background:none;border:0;color:var(--text);font-size:14px;resize:none;min-height:44px;max-height:150px}
.composer textarea:focus{outline:none}
.comp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.comp-row .sp{flex:1}
.modeseg{display:inline-flex;gap:2px;border:1px solid var(--glass-br);border-radius:999px;padding:2px;background:rgba(255,255,255,.02)}
.modeseg button{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:0;background:none;color:var(--muted-2);cursor:pointer}
.modeseg button.on{background:rgba(14,116,144,.22);color:#38BDF8}

/* evidence + confidence */
.ev{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid var(--glass-br);color:#94A3B8;cursor:pointer}
.ev:hover{color:var(--text);border-color:rgba(14,116,144,.4)}
.ev svg{width:11px;height:11px}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700}
.conf .bar{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.conf .bar i{display:block;height:100%;border-radius:3px}
.conf.hi{color:#6EE7B7}.conf.hi .bar i{background:var(--success)}
.conf.md{color:#FCD34D}.conf.md .bar i{background:var(--warn)}
.conf.lo{color:#FCA5A5}.conf.lo .bar i{background:var(--crit)}
.lowconf{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:var(--rs);background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.28);color:#FCA5A5;font-size:12px;margin-top:10px}
.lowconf svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px}

/* factor decomposition */
.fac{margin-top:10px}
.fac-r{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px}
.fac-r .n{min-width:132px;color:var(--muted)}
.fac-r .b{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.fac-r .b i{display:block;height:100%;border-radius:4px;background:var(--grad);transition:width .6s ease}
.fac-r .w{min-width:38px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted-2)}

/* risk heatmap */
.heat{display:grid;grid-template-columns:132px repeat(4,1fr);gap:6px;font-size:11.5px}
.heat .hh{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);padding:4px 2px;text-align:center}
.heat .rl{display:flex;align-items:center;font-weight:600;color:var(--muted)}
.heat .cell{border-radius:8px;padding:9px 4px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;border:1px solid transparent;transition:all .2s}
.heat .cell:hover{border-color:rgba(255,255,255,.3)}
.h-ok{background:rgba(16,185,129,.16);color:#6EE7B7}
.h-md{background:rgba(245,158,11,.18);color:#FCD34D}
.h-hi{background:rgba(249,115,22,.2);color:#FDBA74}
.h-cr{background:rgba(239,68,68,.22);color:#FCA5A5}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl-i{position:relative;padding-bottom:16px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--primary);border:2px solid var(--darker)}
.tl-i.ok::before{background:var(--success)}.tl-i.warn::before{background:var(--warn)}.tl-i.crit::before{background:var(--crit)}
.tl-i b{font-size:13px;font-weight:600;display:block}
.tl-i small{font-size:11.5px;color:var(--muted-2);display:block;margin-top:2px}

/* agents */
.agent{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--rs);border:1px solid var(--glass-br);background:rgba(255,255,255,.02);margin-bottom:10px}
.agent .ai-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.agent .ai-ic svg{width:16px;height:16px}
.agent .tx{flex:1;min-width:0}
.agent .tx b{font-size:13.5px;font-weight:700;display:block}
.agent .tx small{font-size:11.5px;color:var(--muted-2);display:block;margin-top:2px}
.auth{font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:5px;white-space:nowrap}
.auth1{background:rgba(56,189,248,.15);color:#7DD3FC}
.auth2{background:rgba(139,92,246,.18);color:#C4B5FD}
.auth3,.auth4{background:rgba(255,255,255,.06);color:#94A3B8}
.killbar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--rs);background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);margin-bottom:14px;font-size:12.5px;color:#FCA5A5}
.killbar .sp{flex:1}

/* knowledge base citation */
.cite{border-left:3px solid var(--a7);padding:10px 12px;background:rgba(6,182,212,.06);border-radius:0 var(--rs) var(--rs) 0;margin-top:10px;font-size:12.5px}
.cite b{display:block;font-size:12px;color:#67E8F9;margin-bottom:4px}
.cite p{color:var(--muted)}

/* extracted document fields */
.xf{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.xf:last-child{border-bottom:0}
.xf .k{color:var(--muted-2);font-size:12px}
.xf .v{font-weight:600}
.xf input{background:rgba(255,255,255,.03);border:1px solid var(--glass-br);border-radius:8px;padding:6px 9px;color:var(--text);font-size:13px;width:100%}

@media(max-width:1023px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;width:250px;transform:translateX(-100%);transition:transform .25s ease}
 .side.open{transform:none}
 .mobnav{display:grid}
 .c3,.c4,.c5{grid-column:span 6}.c6,.c7,.c8{grid-column:span 12}
 .heat{grid-template-columns:96px repeat(4,1fr);font-size:10.5px}
}
.mobnav{display:none}
@media(max-width:640px){
 .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
 body{--pad:12px}
 .hdr h1{font-size:16px}
 .toasts{left:12px;right:12px;max-width:none}
 .aigrid{grid-template-columns:1fr}
 .chat-bubble{max-width:92%}
 .xf{grid-template-columns:1fr;gap:4px}
 .fac-r .n{min-width:90px}
}

/* ============================================================
   FINANCE & ACCOUNTING — new compositions only.
   Every primitive above is the locked Sprint 01/02 component
   library, reused verbatim. Nothing above this line is edited.
   ============================================================ */

/* finance context bar — scope · period · lock · currency · basis */
.fctx{display:flex;align-items:center;gap:var(--d3);flex-wrap:wrap;padding:10px var(--pad);
 background:rgba(14,116,144,.08);border-bottom:1px solid rgba(14,116,144,.2);font-size:12.5px}
.fctx .f-i{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.fctx .f-i svg{width:14px;height:14px;color:#38BDF8}
.fctx .f-i b{color:var(--text);font-weight:600}
.fctx .sp{flex:1}
body[data-period="locked"] .fctx{background:rgba(239,68,68,.09);border-bottom-color:rgba(239,68,68,.28)}
.lockchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;
 letter-spacing:.05em;padding:3px 8px;border-radius:5px}
.lock-open{background:rgba(16,185,129,.15);color:#6EE7B7}
.lock-shut{background:rgba(239,68,68,.18);color:#FCA5A5}
.lockchip svg{width:11px;height:11px}

/* money */
.mny{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.mny.neg{color:#FCA5A5}
.mny.big{font-size:26px;font-weight:800;letter-spacing:-.02em}
td.mny,th.mny{text-align:right}
tfoot td{border-top:1px solid rgba(255,255,255,.14);font-weight:800;color:var(--text);
 background:rgba(14,116,144,.07)}

/* ledger: separate debit and credit columns, running balance */
.ledger td.d{color:#7DD3FC}
.ledger td.c{color:#FCD34D}
.ledger td.bal{color:var(--text);font-weight:700}

/* live balance indicator on journal forms */
.balbar{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--rs);
 font-size:13px;font-weight:700;margin-top:12px;border:1px solid transparent}
.bal-ok{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#6EE7B7}
.bal-no{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.32);color:#FCA5A5}
.balbar .sp{flex:1}
.balbar svg{width:16px;height:16px}

/* ageing stacked bar */
.age{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--glass-br)}
.age i{display:block;height:100%;transition:width .6s ease}
.age-1{background:#10B981}.age-2{background:#EAB308}.age-3{background:#F97316}.age-4{background:#EF4444}
.age-lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted-2)}
.age-lg span{display:inline-flex;align-items:center;gap:6px}
.age-lg i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* budget variance: diverging bars from a centre line */
.varrow{display:grid;grid-template-columns:150px 1fr 84px;gap:10px;align-items:center;
 padding:7px 0;font-size:12.5px}
.varbar{position:relative;height:20px;background:rgba(255,255,255,.04);border-radius:5px}
.varbar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
.varbar i{position:absolute;top:3px;bottom:3px;border-radius:3px}
.var-under{background:#10B981}.var-over{background:#EF4444}.var-warn{background:#F59E0B}
.varrow .lbl{color:var(--muted)}
.varrow .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* cash-flow projection */
.cf{position:relative;height:190px;display:flex;align-items:flex-end;gap:5px;padding:14px 0 22px}
.cfb{flex:1;position:relative;height:100%}
.cfb .band{position:absolute;left:2px;right:2px;background:rgba(37,99,235,.18);border-radius:3px}
.cfb .pt{position:absolute;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
 background:#38BDF8;border:2px solid var(--dark)}
.cfb .wl{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted-2)}
.cfmin{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(239,68,68,.6);pointer-events:none}
.cfmin span{position:absolute;right:0;top:-16px;font-size:10px;font-weight:700;color:#FCA5A5;
 background:var(--dark);padding:0 5px;border-radius:4px}

/* reconciliation matcher */
.rec{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;align-items:start}
.rec-col{border:1px solid var(--glass-br);border-radius:var(--rs);overflow:hidden}
.rec-h{padding:9px 12px;background:rgba(14,116,144,.1);font-size:10.5px;font-weight:800;
 letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2)}
.rec-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);
 cursor:pointer;transition:background .2s;font-size:12.5px}
.rec-i:last-child{border-bottom:0}
.rec-i:hover{background:rgba(255,255,255,.03)}
.rec-i.sel{background:rgba(14,116,144,.18);box-shadow:inset 3px 0 0 var(--primary)}
.rec-i .tx{flex:1;min-width:0}
.rec-i .tx b{display:block;font-size:12.5px;font-weight:600}
.rec-i .tx small{display:block;font-size:11px;color:var(--muted-2)}
.rec-mid{display:flex;align-items:center;justify-content:center;padding-top:44px}
.recdiff{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--rs);
 font-size:13px;font-weight:700;margin-bottom:14px;border:1px solid transparent}
.recdiff .sp{flex:1}

/* approval chain stepper */
.chain{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:12px 0}
.chain-s{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
 padding:5px 11px;border-radius:999px;border:1px solid var(--glass-br);background:rgba(255,255,255,.03);color:var(--muted-2)}
.chain-s.done{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.3);color:#6EE7B7}
.chain-s.now{background:rgba(14,116,144,.18);border-color:rgba(14,116,144,.45);color:#38BDF8}
.chain-s.block{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35);color:#FCA5A5}
.chain-s svg{width:12px;height:12px}
.chain-a{width:18px;height:1px;background:var(--line)}

/* close checklist */
.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .m{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
.chk .m svg{width:13px}
.chk-pass .m{background:rgba(16,185,129,.16);color:#6EE7B7}
.chk-fail .m{background:rgba(239,68,68,.16);color:#FCA5A5}
.chk .tx{flex:1;min-width:0}
.chk .tx b{display:block;font-size:13px;font-weight:600}
.chk .tx small{display:block;font-size:11.5px;color:var(--muted-2);margin-top:2px}

/* statement */
.stmt th{position:sticky;top:0}
.stmt tbody tr:hover{background:rgba(255,255,255,.03)}

/* three-way match */
.match{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.match-i{padding:11px;border-radius:var(--rs);border:1px solid var(--glass-br);background:rgba(255,255,255,.02);font-size:12px}
.match-i b{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
 color:var(--muted-2);margin-bottom:5px}
.match-i.ok{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.06)}
.match-i.bad{border-color:rgba(239,68,68,.32);background:rgba(239,68,68,.07)}

@media(max-width:1023px){
 .rec{grid-template-columns:1fr}
 .rec-mid{padding:0;justify-content:flex-start}
 .match{grid-template-columns:1fr}
 .varrow{grid-template-columns:110px 1fr 74px}
}
@media(max-width:640px){
 .varrow{grid-template-columns:1fr;gap:4px}
 .varrow .val{text-align:left}
}
</style>
